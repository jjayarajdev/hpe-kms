---
# Prometheus Configuration for KMS 2.6 Monitoring
#
# Scrapes metrics from KMS metrics server and monitors pipeline health

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: 'kms-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
# Temporarily disabled - uncomment after all targets are healthy
# rule_files:
#   - '/etc/prometheus/alerts/*.yml'

# Scrape configurations
scrape_configs:
  # KMS Metrics Server
  - job_name: 'kms-metrics'
    static_configs:
      - targets:
          - 'kms-metrics:9090'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'localhost:9090'

  # Weaviate metrics (if available)
  - job_name: 'weaviate'
    static_configs:
      - targets:
          - 'weaviate:2112'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # Airflow metrics (via StatsD exporter)
  - job_name: 'airflow'
    static_configs:
      - targets:
          - 'statsd-exporter:9102'
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets:
          - 'node-exporter:9100'
    scrape_interval: 30s
