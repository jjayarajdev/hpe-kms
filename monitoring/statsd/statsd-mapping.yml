---
# StatsD Exporter Mapping for Airflow Metrics
#
# Maps Airflow StatsD metrics to Prometheus format

mappings:
  # DAG execution metrics
  - match: "airflow.dag.*.*.duration"
    name: "airflow_dag_duration_seconds"
    timer_type: histogram
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.dag_processing.last_duration.*"
    name: "airflow_dag_processing_duration_seconds"
    labels:
      dag_file: "$1"

  # Task execution metrics
  - match: "airflow.operator_successes.*"
    name: "airflow_operator_successes_total"
    labels:
      operator: "$1"

  - match: "airflow.operator_failures.*"
    name: "airflow_operator_failures_total"
    labels:
      operator: "$1"

  # Scheduler metrics
  - match: "airflow.scheduler.heartbeat"
    name: "airflow_scheduler_heartbeat"

  - match: "airflow.scheduler.tasks.running"
    name: "airflow_scheduler_tasks_running"

  - match: "airflow.scheduler.tasks.starving"
    name: "airflow_scheduler_tasks_starving"

  # Executor metrics
  - match: "airflow.executor.open_slots"
    name: "airflow_executor_open_slots"

  - match: "airflow.executor.queued_tasks"
    name: "airflow_executor_queued_tasks"

  - match: "airflow.executor.running_tasks"
    name: "airflow_executor_running_tasks"

  # Pool metrics
  - match: "airflow.pool.open_slots.*"
    name: "airflow_pool_open_slots"
    labels:
      pool: "$1"

  - match: "airflow.pool.used_slots.*"
    name: "airflow_pool_used_slots"
    labels:
      pool: "$1"

  # DAG bag metrics
  - match: "airflow.dagbag_size"
    name: "airflow_dagbag_size"

  # Task instance metrics
  - match: "airflow.ti.start.*.*"
    name: "airflow_ti_start_total"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_ti_finish_total"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"
